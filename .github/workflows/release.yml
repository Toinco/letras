# Publica una versión nueva: al subir un tag "v1.2.0" arma el APK firmado
# y la app de Mac (un ZIP con Letras.app) y los publica en GitHub Releases. La app instalada lo detecta sola en
# Ajustes > Buscar actualizaciones.
#
#   git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver scripts/crear_llave.sh)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/letras-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/letras-release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Compilar APK firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AUDD_TOKEN: ${{ secrets.AUDD_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=UPDATE_REPO="${{ github.repository }}" \
            --dart-define=AUDD_TOKEN="$AUDD_TOKEN"
          mv build/app/outputs/flutter-apk/app-release.apk "build/letras-$VERSION.apk"

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/letras-*.apk
          generate_release_notes: true

  macos:
    # Después del APK, para no crear dos releases a la vez.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      # Firma "ad hoc" (sin cuenta de Apple Developer): la primera vez hay
      # que abrirla desde Ajustes del Sistema > Privacidad y seguridad.
      - name: Compilar Letras.app
        env:
          AUDD_TOKEN: ${{ secrets.AUDD_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build macos --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=UPDATE_REPO="${{ github.repository }}" \
            --dart-define=AUDD_TOKEN="$AUDD_TOKEN"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Letras.app "build/letras-$VERSION-macos.zip"

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/letras-*-macos.zip

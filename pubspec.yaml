name: lyrics_app
description: "App de letras de canciones estilo Apple Music, con detección automática de lo que estás escuchando."
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Peticiones HTTP a la API de letras (LRCLIB) y de reconocimiento de audio (AudD)
  http: ^1.2.1

  # Manejo de estado simple
  provider: ^6.1.2

  # Guardar letras descargadas en el almacenamiento del teléfono
  path_provider: ^2.1.3

  # Guardar preferencias simples (API key de AudD, índice de descargas)
  shared_preferences: ^2.2.3

  # Pedir permisos (micrófono) en tiempo de ejecución
  permission_handler: ^11.3.1

  # Grabar audio del micrófono para el reconocimiento tipo Shazam
  record: ^6.1.1

  # Abrir el navegador para el login de Spotify (OAuth)
  url_launcher: ^6.3.2

  # Generar el code_challenge (PKCE) para el login de Spotify sin necesitar
  # un client secret embebido en la app
  crypto: ^3.0.6

  # Caché en memoria y disco para las carátulas de álbumes/artistas, así
  # no se vuelven a descargar cada vez que se reconstruye una lista
  # (mejora notable de rendimiento en Buscar/Álbumes/Artistas)
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.7.0
  share_plus: ^13.3.1
  yaml: ^3.1.4
  sqflite: ^2.4.2+1
  path: ^1.9.1
  archive: ^4.5.2
  file_picker: ^13.1.0
  flutter_riverpod: ^2.6.1
  package_info_plus: ^10.2.2
  html_unescape: ^2.0.0
  # SQLite en Windows (sqflite no tiene versión para Windows)
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
